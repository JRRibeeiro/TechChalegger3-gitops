apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-togglemaster
  namespace: monitoring
  labels:
    grafana_alert: '1'
data:
  rules.yaml: "apiVersion: 1\ngroups:\n- orgId: 1\n  name: togglemaster-fase4\n  folder: ToggleMaster\n  interval: 30s\n  rules:\n  - uid: auth-5xx-rate\n    title: 'auth-service: taxa de erro 5xx acima de 5%'\n    condition: C\n    for: 1m\n    data:\n    - refId: A\n      relativeTimeRange:\n        from: 600\n        to: 0\n      datasourceUid: prometheus\n      model:\n        refId: A\n        editorMode: code\n        expr: 100 * (sum(rate(calls_total{service_name=\"auth-service\", http_response_status_code=~\"5..\"}[5m]))\n          or vector(0)) / clamp_min(sum(rate(calls_total{service_name=\"auth-service\"}[5m])),\n          1)\n        instant: true\n        intervalMs: 1000\n        maxDataPoints: 43200\n    - refId: C\n      datasourceUid: __expr__\n      model:\n        refId: C\n        type: threshold\n        expression: A\n        conditions:\n        - type: query\n          evaluator:\n            type: gt\n            params:\n            - 5\n            - 0\n          operator:\n            type: and\n          query:\n            params:\n            - C\n          reducer:\n            type: last\n    noDataState: OK\n    execErrState: Error\n    labels:\n      severity: critical\n      deployment: auth-service\n      self_healing: rollout-restart\n    annotations:\n      summary: auth-service com mais de 5% de respostas 5xx\n      description: A taxa de erro 5xx do auth-service esta em {{ $values.A }}% (limite\n        5%). O self-healer vai reiniciar o deployment.\n      runbook: services/self-healer executa rollout restart deployment/auth-service\n"
  contactpoints.yaml: "apiVersion: 1\ncontactPoints:\n- orgId: 1\n  name: togglemaster-oncall\n  receivers:\n  - uid: tm-pagerduty\n    type: pagerduty\n    settings:\n      integrationKey: $PAGERDUTY_ROUTING_KEY\n      severity: critical\n      summary: '{{ .CommonAnnotations.summary }}'\n  - uid: tm-discord\n    type: discord\n    settings:\n      url: $DISCORD_WEBHOOK_URL\n      title: '{{ .CommonLabels.alertname }}'\n      message: '{{ .CommonAnnotations.description }}'\n- orgId: 1\n  name: togglemaster-autoheal\n  receivers:\n  - uid: ah-pagerduty\n    type: pagerduty\n    settings:\n      integrationKey: $PAGERDUTY_ROUTING_KEY\n      severity: critical\n      summary: '{{ .CommonAnnotations.summary }}'\n  - uid: ah-discord\n    type: discord\n    settings:\n      url: $DISCORD_WEBHOOK_URL\n      title: '[auto-healing] {{ .CommonLabels.alertname }}'\n      message: '{{ .CommonAnnotations.description }}'\n  - uid: ah-webhook\n    type: webhook\n    settings:\n      url: http://self-healer.monitoring.svc.cluster.local:8080/webhook\n      httpMethod: POST\n      authorization_scheme: Bearer\n      authorization_credentials: $SELF_HEALER_TOKEN\n"
  policies.yaml: "apiVersion: 1\npolicies:\n- orgId: 1\n  receiver: togglemaster-oncall\n  group_by:\n  - grafana_folder\n  - alertname\n  group_wait: 30s\n  group_interval: 5m\n  repeat_interval: 4h\n  routes:\n  - receiver: togglemaster-autoheal\n    object_matchers:\n    - - self_healing\n      - '='\n      - rollout-restart\n    group_wait: 10s\n    group_interval: 1m\n    repeat_interval: 10m\n    continue: false\n"
