apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: techchallenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          # A tag abaixo e reescrita pelo pipeline a cada deploy.
          # Nao edite na mao: o proximo push do CI sobrescreve.
          image: 419587853242.dkr.ecr.us-east-1.amazonaws.com/analytics-service:v1.0.0-0000000
          ports:
            - containerPort: 8005
          env:
            - name: PORT
              value: "8005"
          envFrom:
            - configMapRef:
                name: analytics-service-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
