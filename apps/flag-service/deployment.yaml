apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: techchallenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          # A tag abaixo e reescrita pelo pipeline a cada deploy.
          # Nao edite na mao: o proximo push do CI sobrescreve.
          image: 419587853242.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1.0.0-e29c740
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
          envFrom:
            - configMapRef:
                name: flag-service-config
            - secretRef:
                name: flag-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
