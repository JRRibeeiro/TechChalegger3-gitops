apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: techchallenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          # A tag abaixo e reescrita pelo pipeline a cada deploy.
          # Nao edite na mao: o proximo push do CI sobrescreve.
          image: 353683647248.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1.0.0-662bfc4
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-gateway.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: flag-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=togglemaster,deployment.environment=academy
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          envFrom:
            - configMapRef:
                name: flag-service-config
            - secretRef:
                name: flag-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
