# Loki (single binary) em manifestos proprios, sem depender de Helm chart externo.
# A config foi validada com o binario oficial do Loki (loki -verify-config).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki-config.yaml: "auth_enabled: false            # tenant unico; sem header X-Scope-OrgID\n\nserver:\n  http_listen_port: 3100\n  grpc_listen_port: 9095\n  log_level: info\n\ncommon:\n  path_prefix: /var/loki\n  replication_factor: 1\n  ring:\n    kvstore:\n      store: inmemory\n  storage:\n    filesystem:\n      chunks_directory: /var/loki/chunks\n      rules_directory: /var/loki/rules\n\nschema_config:\n  configs:\n    - from: \"2024-04-01\"\n      store: tsdb\n      object_store: filesystem\n      schema: v13           # exigido para ingestao OTLP com metadados estruturados\n      index:\n        prefix: index_\n        period: 24h\n\nstorage_config:\n  tsdb_shipper:\n    active_index_directory: /var/loki/tsdb-index\n    cache_location: /var/loki/tsdb-cache\n  filesystem:\n    directory: /var/loki/chunks\n\nlimits_config:\n  allow_structured_metadata: true   # necessario para os atributos que chegam via OTLP\n  volume_enabled: true\n  retention_period: 72h\n  reject_old_samples: true\n  reject_old_samples_max_age: 168h\n\ncompactor:\n  working_directory: /var/loki/compactor\n  retention_enabled: true\n  delete_request_store: filesystem\n\npattern_ingester:\n  enabled: false\n\nruler:\n  storage:\n    type: local\n    local:\n      directory: /var/loki/rules\n\nanalytics:\n  reporting_enabled: false      # nao envia telemetria de uso para o Grafana Labs\n"
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
  - name: grpc
    port: 9095
    targetPort: 9095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
      - name: loki
        image: grafana/loki:3.7.8
        args:
        - -config.file=/etc/loki/loki-config.yaml
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 9095
          name: grpc
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /var/loki
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: storage
        emptyDir:
          sizeLimit: 8Gi
